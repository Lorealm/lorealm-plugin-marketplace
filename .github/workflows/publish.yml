name: Publish the index

# Builds index.json and the READMEs from every plugin file, and publishes
# them with GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Releases are kept by their hash, so each is downloaded once.
      - uses: actions/cache@v4
        with:
          path: cache
          key: releases-${{ hashFiles('plugins/*.toml') }}
          restore-keys: releases-
      - run: cargo test --release --quiet
      - run: cargo run --release --quiet -- build --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
