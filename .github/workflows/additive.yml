name: Flag changes to what's listed

# Comments on a pull request that does more than add a plugin or a version:
# one that removes a plugin, or removes or alters a version already listed.
on:
  pull_request_target:
    paths: ["plugins/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  flag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tool
      # The pull request is never checked out. Its plugin files are fetched
      # one by one and laid over the ones listed now.
      - name: Fetch the pull request's plugin files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cp -r tool/plugins current
          plugin_file='^plugins/[A-Za-z0-9_]+\.toml$'
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | [.status, .filename, (.previous_filename // "-")] | @tsv' > changes.tsv
          while IFS=$'\t' read -r status file previous; do
            if [[ "$previous" =~ $plugin_file ]]; then
              rm -f "current/$(basename "$previous")"
            fi
            [[ "$file" =~ $plugin_file ]] || continue
            if [ "$status" = removed ]; then
              rm -f "current/$(basename "$file")"
            else
              gh api --method GET -H "Accept: application/vnd.github.raw" \
                "repos/$GITHUB_REPOSITORY/contents/$file" -f ref="$HEAD" > "current/$(basename "$file")"
            fi
          done < changes.tsv
      - name: Compare with what's listed
        working-directory: tool
        run: cargo run --release --quiet -- additive --previous plugins --current ../current > ../findings.md
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -s findings.md ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file findings.md
            exit 1
          fi
          # Nothing is taken back any more: say so where it was flagged before.
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last \
            --body "This pull request now only adds to what's listed." 2>/dev/null || true
